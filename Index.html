<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAVOX AI Agent</title>
<style>
:root{--bg:#0b0b0d;--panel:#111114;--card:#18181c;--line:#29292f;--text:#f4f4f5;--muted:#92929b}
*{box-sizing:border-box}
body{margin:0;height:100vh;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif;overflow:hidden}
.app{height:100vh;display:flex}
.sidebar{width:270px;background:var(--panel);border-right:1px solid var(--line);padding:15px;display:flex;flex-direction:column}
.logo{font-size:20px;font-weight:800;padding:12px 9px 20px}
.newchat{border:1px solid #36363d;background:#19191d;color:#fff;border-radius:12px;padding:12px;text-align:left;font-weight:650;cursor:pointer}
.nav{margin-top:18px;color:#999}
.nav div{padding:11px 10px;border-radius:10px}.nav div:hover{background:#1a1a1e;color:#fff}
.bottom{margin-top:auto;color:#666;font-size:12px;padding:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.header{height:58px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;font-weight:700}
.header span{color:#777;font-weight:400;margin-left:8px;font-size:12px}
.chat{flex:1;overflow:auto;padding:28px 16px 145px}
.wrap{max-width:850px;margin:auto}
.welcome{text-align:center;padding:12vh 10px 50px}
.welcome h1{font-size:32px;margin:0 0 10px}.welcome p{color:var(--muted)}
.message{display:flex;gap:13px;margin:23px 0}
.avatar{width:33px;height:33px;min-width:33px;border-radius:9px;background:#25252a;display:grid;place-items:center;font-size:12px;font-weight:800}
.agent .avatar{background:#eee;color:#111}
.bubble{max-width:calc(100% - 48px);line-height:1.6;word-break:break-word}
.user .bubble{background:#19191d;border:1px solid #2d2d33;padding:11px 14px;border-radius:14px}
.meta{font-size:11px;color:#6f6f78;margin-top:7px}
.composer-wrap{position:fixed;left:270px;right:0;bottom:0;padding:18px;background:linear-gradient(transparent,var(--bg) 34%)}
.composer{max-width:850px;margin:auto;background:#17171b;border:1px solid #34343b;border-radius:18px;padding:8px;display:flex;gap:8px;align-items:center}
.icon{width:43px;height:43px;border:0;border-radius:11px;background:#29292f;color:#fff;display:grid;place-items:center;cursor:pointer}
.icon.active{background:#eee;color:#111}
.input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#fff;padding:11px;font-size:15px}
.send{width:43px;height:43px;border:0;border-radius:11px;background:#eee;color:#111;font-size:18px;font-weight:800;cursor:pointer}
.status{max-width:850px;margin:7px auto 0;color:#686871;font-size:11px;padding:0 4px}
@media(max-width:700px){.sidebar{display:none}.composer-wrap{left:0}.welcome h1{font-size:27px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="logo">NAVOX AI</div>
  <button class="newchat" onclick="newChat()">＋ New chat</button>
  <div class="nav">
    <div>⌕ Search</div>
    <div>▣ Recent tasks</div>
    <div>⚙ Settings</div>
  </div>
  <div class="bottom">NAVOX Agent · Chrome Edition</div>
</aside>

<main class="main">
<header class="header">NAVOX Agent <span>Intent → Action → Verify</span></header>

<section class="chat" id="chat">
<div class="wrap" id="messages">
  <div class="welcome" id="welcome">
    <h1>What should I do?</h1>
    <p>Try “Open YouTube”, “Open Instagram”, or “Search AI news”.</p>
  </div>
</div>
</section>
</main>
</div>

<div class="composer-wrap">
<div class="composer">
<button class="icon" id="mic" title="Voice command" aria-label="Voice command">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none">
<rect x="8.5" y="3" width="7" height="12" rx="3.5" stroke="currentColor" stroke-width="1.8"/>
<path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
</svg>
</button>
<input class="input" id="input" placeholder="Tell NAVOX what to do..." autocomplete="off">
<button class="send" id="send">↑</button>
</div>
<div class="status" id="status">Ready</div>
</div>

<script>
const input=document.getElementById("input");
const messages=document.getElementById("messages");
const status=document.getElementById("status");
const mic=document.getElementById("mic");

const sites={
 youtube:"https://www.youtube.com/",
 instagram:"https://www.instagram.com/",
 chatgpt:"https://chatgpt.com/",
 chrome:"https://www.google.com/",
 gmail:"https://mail.google.com/",
 google:"https://www.google.com/"
};

const stores={
 youtube:"https://play.google.com/store/apps/details?id=com.google.android.youtube",
 instagram:"https://play.google.com/store/apps/details?id=com.instagram.android",
 chatgpt:"https://play.google.com/store/apps/details?id=com.openai.chatgpt",
 chrome:"https://play.google.com/store/apps/details?id=com.android.chrome",
 gmail:"https://play.google.com/store/apps/details?id=com.google.android.gm"
};

function addMessage(text,type,meta=""){
 document.getElementById("welcome")?.remove();
 const row=document.createElement("div");
 row.className="message "+type;
 const avatar=document.createElement("div");
 avatar.className="avatar";
 avatar.textContent=type==="user"?"U":"N";
 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;
 if(meta){
   const m=document.createElement("div");
   m.className="meta";
   m.textContent=meta;
   bubble.appendChild(m);
 }
 row.append(avatar,bubble);
 messages.appendChild(row);
 document.getElementById("chat").scrollTop=999999;
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();
 const voice=new SpeechSynthesisUtterance(text);
 voice.lang="en-IN";
 voice.rate=.95;
 voice.pitch=.9;
 speechSynthesis.speak(voice);
}

function cleanTarget(text){
 return text.toLowerCase().replace(/[.,!?]/g,"").trim();
}

/*
 IMPORTANT:
 Normal "Open YouTube" NEVER goes to Play Store.
 Play Store is used only when the user explicitly says:
 "Play Store", "Install", or "Update".
*/
function detectCommand(raw){
 const c=cleanTarget(raw);

 const names=["youtube","instagram","chatgpt","chrome","gmail"];

 // Open an app/site and then search inside it.
 for(const name of names){
   const patterns=[
     new RegExp("^open\\s+"+name+"\\s+and\\s+search\\s+(.+)$","i"),
     new RegExp("^open\\s+"+name+"\\s+search\\s+(.+)$","i"),
     new RegExp("^launch\\s+"+name+"\\s+and\\s+search\\s+(.+)$","i")
   ];
   for(const p of patterns){
     const m=c.match(p);
     if(m) return {type:"APP_SEARCH",name,query:m[1].trim()};
   }
 }

 // Explicit Play Store commands only.
 for(const name of names){
   const explicitStore =
     c.includes(name) &&
     (c.includes("play store") || c.includes("playstore") ||
      c.startsWith("install "+name) ||
      c.startsWith("update "+name));

   if(explicitStore) return {type:"STORE",name};

   if(c==="open "+name || c==="open "+name+" app" || c==="launch "+name)
     return {type:"WEB",name};

   if(c==="open "+name+" website")
     return {type:"WEB",name};
 }

 if(c==="open google" || c==="launch google")
   return {type:"WEB",name:"google"};

 if(c.startsWith("search "))
   return {type:"SEARCH",query:raw.trim().slice(7)};

 if(c.startsWith("find "))
   return {type:"SEARCH",query:raw.trim().slice(5)};

 return {type:"SEARCH",query:raw.trim()};
}

function runCommand(){
 const raw=input.value.trim();
 if(!raw)return;
 input.value="";
 addMessage(raw,"user");
 status.textContent="Analyzing command…";

 const cmd=detectCommand(raw);

 setTimeout(()=>{
   if(cmd.type==="APP_SEARCH"){
     const msg="Opening "+cmd.name+" and searching for "+cmd.query+".";
     addMessage(msg,"agent","Action: Open → Search");
     status.textContent="Opening "+cmd.name+"…";
     speak("Opening "+cmd.name+".");

     // Chrome cannot reliably automate search inside an installed mobile app.
     // For this browser version, use the official website's search URL.
     setTimeout(()=>{
       const q=encodeURIComponent(cmd.query);
       const searchUrls={
         youtube:"https://www.youtube.com/results?search_query="+q,
         instagram:"https://www.instagram.com/explore/search/keyword/?q="+q,
         chatgpt:"https://chatgpt.com/?q="+q,
         chrome:"https://www.google.com/search?q="+q,
         gmail:"https://mail.google.com/mail/u/0/#search/"+q
       };
       location.href=searchUrls[cmd.name] || sites[cmd.name];
     },900);
     return;
   }

   if(cmd.type==="STORE"){
     const msg="Opening "+cmd.name+" Play Store page.";
     addMessage(msg,"agent","Explicit Play Store request");
     status.textContent="Action: Play Store";
     speak(msg);
     setTimeout(()=>location.href=stores[cmd.name],500);
     return;
   }

   if(cmd.type==="WEB"){
     const msg="Opening "+cmd.name+".";
     addMessage(msg,"agent","Action: Official website");
     status.textContent="Action: Official website";
     speak(msg);
     setTimeout(()=>location.href=sites[cmd.name],650);
     return;
   }

   const msg="Searching for "+cmd.query+".";
   addMessage(msg,"agent","Action: Web search");
   status.textContent="Action: Search";
   speak(msg);
   setTimeout(()=>location.href="https://www.google.com/search?q="+encodeURIComponent(cmd.query),650);
 },220);
}

function newChat(){
 messages.innerHTML='<div class="welcome" id="welcome"><h1>What should I do?</h1><p>Try “Open YouTube”, “Open Instagram”, or “Search AI news”.</p></div>';
 status.textContent="Ready";
 input.focus();
}

document.getElementById("send").onclick=runCommand;
input.addEventListener("keydown",e=>{if(e.key==="Enter")runCommand()});

mic.onclick=()=>{
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){
   addMessage("Voice recognition is not available in this Chrome browser.","agent");
   status.textContent="Voice unavailable";
   return;
 }

 const recognition=new Speech();
 recognition.lang="en-IN";
 recognition.interimResults=false;
 recognition.continuous=false;

 recognition.onstart=()=>{
   mic.classList.add("active");
   mic.innerHTML="■";
   input.placeholder="Listening…";
   status.textContent="Listening…";
 };

 recognition.onresult=e=>{
   input.value=e.results[0][0].transcript;
   runCommand();
 };

 recognition.onerror=e=>{
   const text=e.error==="not-allowed"
    ?"Microphone permission was denied. Allow microphone access in Chrome."
    :"I couldn't understand the command.";
   addMessage(text,"agent");
   status.textContent="Voice error";
 };

 recognition.onend=()=>{
   mic.classList.remove("active");
   mic.innerHTML=`<svg width="21" height="21" viewBox="0 0 24 24" fill="none">
   <rect x="8.5" y="3" width="7" height="12" rx="3.5" stroke="currentColor" stroke-width="1.8"/>
   <path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M9 21h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
   input.placeholder="Tell NAVOX what to do...";
 };

 try{recognition.start()}catch(e){}
};
</script>
</body>
</html>
